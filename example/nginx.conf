user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    resolver 169.254.169.253 valid=30s;

    upstream dev_app {
        server app-svc.app.local:3000;  # Replace with service discovery DNS or internal load balancer if possible
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  localhost;

        # Health check endpoint (used by ALB)
        location = / {
            return 200 'NGINX is healthy';
            add_header Content-Type text/plain;
        }

        # Route to /dev/ backend
        location /dev/ {
            proxy_pass http://dev_app/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}


